# MkDocs configuration for the canonical DeFiChain documentation suite.
#
# The site is built from the `docs/` directory and rendered with
# Material for MkDocs. The layout, the Diataxis authoring rules and the
# ownership boundaries are defined by ADR-0002
# (`docs/developer-manual/adr/ADR-0002-documentation-structure.md`).
#
# Build locally with:
#   pip install -r docs/requirements.txt
#   mkdocs serve
#   mkdocs build --strict

site_name: DeFiChain Documentation
site_description: >-
  Canonical documentation suite of the DeFiChain node: user and protocol
  manual, node software manual, developer and architecture manual.
site_author: DeFiChain contributors

repo_url: https://github.com/DeFiCh/ain
repo_name: DeFiCh/ain

docs_dir: docs
site_dir: site

# Contributor-facing files that must not end up in the published bundle.
exclude_docs: |
  README.md
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

