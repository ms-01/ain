name: Fuzz

on:
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Max fuzzing time per target in seconds"
        required: false
        default: "300"
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TARGET: x86_64-pc-linux-gnu
  MAKE_DEBUG: 0

jobs:
  fuzz:
    runs-on: ubuntu-latest
    container:
      image: defi/ain-builder:latest
    env:
      CARGO_INCREMENTAL: 0
      FUZZ_TIME: ${{ github.event.inputs.max_total_time || '300' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Populate environment
      run: ./make.sh ci-export-vars

    - name: Setup dependencies
      run: |
        ./make.sh ci-setup-deps
        ./make.sh ci-setup-user-deps
        # clang-15 (and clang++-15) are already installed by ./make.sh ci-setup-deps.
        # The compiler-rt runtimes provide libFuzzer/ASan/UBSan (libclang_rt.*).
        apt-get update && apt-get install -y libclang-rt-15-dev

    - name: Build dependencies
      run: ./make.sh build-deps

    - name: Configure and build fuzz binary
      run: |
        REPO_ROOT="$(pwd)"
        ./autogen.sh
        mkdir -p build-fuzz
        cd build-fuzz
        # CONFIG_SITE must point at the depends-built config.site, mirroring make.sh
        # (build_conf): it provides with_boost, CPPFLAGS/LDFLAGS, PROTOC and SOLC_PATH.
        # Sanitizer builds are linked non-PIE by configure itself (see configure.ac,
        # SANITIZER_NO_PIE_LDFLAGS): the ASan runtime reserves
        # 0x600000000000-0x700000000000 with MAP_FIXED and a PIE executable that
        # ASLR loads into that range would be clobbered by that reservation,
        # which makes the fuzz binary die with SIGSEGV during startup.
        CC=clang-15 CXX=clang++-15 \
        CONFIG_SITE="${REPO_ROOT}/build/depends/${TARGET}/share/config.site" \
          ../configure \
          --prefix="${REPO_ROOT}/build/depends/${TARGET}" \
          --enable-fuzz \
          --with-sanitizers=fuzzer,address,undefined
        # Build the Rust workspace first (it provides ain_rs_exports.h and
        # libain_rs_exports.a), then the fuzz binary itself. Only the fuzz
        # target is built here; the complete tree is covered by the regular CI
        # workflow. Note that --enable-fuzz sets use_bench=no, so bench/bench_defi
        # is not part of a fuzz build tree (ENABLE_BENCH is true only when the
        # benchmark is enabled).
        make -j"$(nproc)" -C lib
        make -j"$(nproc)" -C src test/fuzz/fuzz

    - name: Fuzz binary startup regression check
      run: ./ci/fuzz/main.sh build-fuzz/src/test/fuzz/fuzz 100

    - name: List fuzz targets
      run: PRINT_ALL_FUZZ_TARGETS_AND_ABORT=1 ./build-fuzz/src/test/fuzz/fuzz

    - name: Prepare fuzz artifacts directory
      run: mkdir -p fuzz-artifacts

    - name: Run fuzz targets
      run: |
        TARGETS="partially_downloaded_block p2p_message_parsing transaction addrv2_deserialize netaddr_str script_flags"
        for target in $TARGETS; do
          echo "=== Fuzzing target: $target (${FUZZ_TIME}s) ==="
          FUZZ="$target" ./build-fuzz/src/test/fuzz/fuzz \
            -max_total_time="${FUZZ_TIME}" \
            -artifact_prefix="$(pwd)/fuzz-artifacts/${target}-"
        done

    - name: Upload fuzz crash artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crash-artifacts
        path: fuzz-artifacts/
        if-no-files-found: ignore
