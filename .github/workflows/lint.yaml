name: Lint

on:
  workflow_dispatch:
  push:
    tags:
      - "!v*"
    branches:
      - master
  pull_request:
    branches:
      - master
      - feature/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  TARGET: x86_64-pc-linux-gnu
  MAKE_DEBUG: 0

jobs:
  generic:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: latest # Computed
      GITHUB_PULL_REQUEST: ${{ github.event.number }}
      PYTHON: 3.12
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup LLVM 15
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clang-15 clang-format-15

    - name: Lint
      run: ./ci/lint/main.sh

    - name: Extended Lint
      run: ./ci/extended_lint/main.sh

  rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    container: defi/ain-builder:latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - run: git config --global --add safe.directory '*'

    - name: Populate environment
      run: ./make.sh ci-export-vars

    - name: Setup dependencies
      run: ./make.sh ci-setup-deps

    - name: Setup dependencies for user
      run: ./make.sh ci-setup-user-deps

    - name: Rust lint cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: lib -> ../build/lib/target
        save-if: ${{ github.ref == 'refs/heads/master' }}
        shared-key: lint

    - name: Build depends and configure
      run: ./make.sh build-deps && ./make.sh build-conf

    - name: Format checks
      run: ./make.sh lib fmt-check 1

    - name: Clippy checks
      run: ./make.sh lib clippy 1

    - name: Install cargo-audit
      run: |
        mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
        curl -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz \
          | tar -xz -C "${CARGO_HOME:-$HOME/.cargo}/bin" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.23.0/cargo-audit

    - name: Cargo audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
